services:
  - type: web
    name: tg-bot-rotator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Строго один воркер: два процесса одновременно опрашивали бы Telegram одним токеном
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@example.com
      # «Купить конфеты» (по желанию): оплата CryptoBot / Telegram Stars / картой (чеки разбирают админы в боте для чеков)
      - key: CRYPTO_PAY_TOKEN
        sync: false
      - key: STARS_BOT_TOKEN
        sync: false
      - key: CHECK_BOT_TOKEN
        sync: false
      - key: CHECK_ADMIN_IDS
        sync: false
