<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход · Bot Rotator</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--text:#14171c;--muted:#6b7280;--line:#e6e8ec;--blue:#2563eb;--red:#dc2626;color-scheme:light dark}
  @media(prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#171a1f;--text:#eceef2;--muted:#8b93a1;--line:#262a31}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);
       font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
  h1{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
  p{margin:0 0 20px;color:var(--muted)}
  input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  input:focus{outline:2px solid var(--blue);outline-offset:-1px}
  button{width:100%;margin-top:12px;height:44px;border:0;border-radius:12px;background:var(--text);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
  .err{margin-top:12px;color:var(--red);font-size:14px}
</style>
</head>
<body>
  <form class="box" method="post" action="/login">
    <h1>Bot Rotator</h1>
    <p>Введите пароль, чтобы продолжить</p>
    <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
    <button type="submit">Войти</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
